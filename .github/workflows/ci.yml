name: CI

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Optional pull request number to validate and report
        required: false
        default: 0
        type: number

jobs:
  policy:
    name: Repository policy
    runs-on: ubuntu-latest
    outputs:
      validated_head_sha: ${{ steps.checked_out.outputs.head_sha }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve pull-request revision
        if: inputs.pull_request_number > 0
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test -n "$head_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=refs/pull/${PR_NUMBER}/head" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pull_request.outputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked-out pull-request revision
        id: checked_out
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pull_request.outputs.head_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_HEAD_SHA" ]; then
            test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          fi
          echo "head_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
      - name: Set up Go from the reviewed module manifest
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run policy checks and tests
        run: make check

  crypto_kat:
    name: Independent Swift and Go crypto KAT
    needs: policy
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Check out the exact validated revision with approval history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.validated_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ needs.policy.outputs.validated_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Go from the reviewed module manifest
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision the reviewed OpenSSL 3 provider
        run: brew install openssl@3
      - name: Reproduce independent Swift and Go vectors
        run: make kat

  runtime_matrix:
    name: Runtime ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.validated_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ needs.policy.outputs.validated_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Go from the reviewed runtime manifest
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Build and execute the native single-file runtime
        env:
          RUNTIME_VERSION: ${{ needs.policy.outputs.validated_head_sha }}
        run: |
          make runtime-build-one RUNTIME_GOOS=${{ matrix.goos }} RUNTIME_GOARCH=${{ matrix.goarch }} VERSION="$RUNTIME_VERSION"
          python3 scripts/check_runtime_release.py \
            --dist dist \
            --version "$RUNTIME_VERSION" \
            --target ${{ matrix.goos }}/${{ matrix.goarch }} \
            --execute-native
      - name: Verify the macOS user service through an SSH tunnel
        if: runner.os == 'macOS'
        env:
          JAT_RUNTIME_SERVICE_BINARY: ${{ github.workspace }}/dist/sshserver-${{ matrix.goos }}-${{ matrix.goarch }}
        run: go test -mod=readonly -run '^TestRuntimeUserServiceSSHTunnel$' -v ./integration

  report:
    name: Publish repository-policy status
    if: always() && inputs.pull_request_number > 0
    needs: [policy, crypto_kat, runtime_matrix]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Publish result on pull-request head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          POLICY_RESULT: ${{ needs.policy.result }}
          KAT_RESULT: ${{ needs.crypto_kat.result }}
          RUNTIME_RESULT: ${{ needs.runtime_matrix.result }}
          VALIDATED_HEAD_SHA: ${{ needs.policy.outputs.validated_head_sha }}
        run: |
          set -euo pipefail
          test -n "$VALIDATED_HEAD_SHA"
          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$current_head_sha" = "$VALIDATED_HEAD_SHA"
          state=failure
          description="Manual policy, crypto KAT, or runtime matrix failed"
          if [ "$POLICY_RESULT" = success ] && [ "$KAT_RESULT" = success ] && [ "$RUNTIME_RESULT" = success ]; then
            state=success
            description="Manual policy, crypto KAT, and runtime matrix passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${VALIDATED_HEAD_SHA}" \
            -f state="$state" \
            -f context="Repository policy" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
