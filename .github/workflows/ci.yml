name: CI

on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Optional pull request number to validate and report
        required: false
        default: 0
        type: number

jobs:
  policy:
    timeout-minutes: 120
    name: Repository policy
    runs-on: [self-hosted, linux, X64, kcice-ci]
    outputs:
      validated_head_sha: ${{ steps.checked_out.outputs.head_sha }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve pull-request revision
        if: inputs.pull_request_number > 0
        id: pull_request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.repo.full_name)" = "$GITHUB_REPOSITORY"
          head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test -n "$head_sha"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "checkout_ref=refs/pull/${PR_NUMBER}/head" >> "$GITHUB_OUTPUT"
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pull_request.outputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record checked-out pull-request revision
        id: checked_out
        env:
          EXPECTED_HEAD_SHA: ${{ steps.pull_request.outputs.head_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_HEAD_SHA" ]; then
            test "$checked_out_sha" = "$EXPECTED_HEAD_SHA"
          fi
          echo "head_sha=$checked_out_sha" >> "$GITHUB_OUTPUT"
      - name: Set up Go from the reviewed module manifest
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Run policy checks and tests
        run: make check

  crypto_kat:
    timeout-minutes: 120
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Independent Swift and Go crypto KAT
    needs: policy
    runs-on: [self-hosted, macOS, ARM64, kcice-ci]
    permissions:
      contents: read
    steps:
      - name: Check out the exact validated revision with approval history
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.validated_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ needs.policy.outputs.validated_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Go from the reviewed module manifest
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Provision the reviewed OpenSSL 3 provider
        env:
          OPENSSL_PREFIX: ${{ runner.tool_cache }}/openssl/3.6.3
        run: |
          set -euo pipefail
          if [ ! -x "$OPENSSL_PREFIX/bin/openssl" ]; then
            build_dir="$(mktemp -d "$RUNNER_TEMP/openssl.XXXXXX")"
            trap 'rm -rf "$build_dir"' EXIT
            cd "$build_dir"
            curl --fail --location --retry 3 --proto '=https' \
              https://github.com/openssl/openssl/releases/download/openssl-3.6.3/openssl-3.6.3.tar.gz \
              -o openssl.tar.gz
            echo '243a86649cf6f23eeb6a2ff2456e09e5d77dd9018a54d3d96b0c6bdd6ba6c7f1  openssl.tar.gz' | shasum -a 256 -c -
            tar xzf openssl.tar.gz
            cd openssl-3.6.3
            ./Configure --prefix="$OPENSSL_PREFIX" no-shared
            make -j4
            make install_sw
          fi
          "$OPENSSL_PREFIX/bin/openssl" version
          echo "JAT_OPENSSL_BIN=$OPENSSL_PREFIX/bin/openssl" >> "$GITHUB_ENV"
      - name: Reproduce independent Swift and Go vectors
        run: make kat

  runtime_matrix:
    timeout-minutes: 120
    name: Runtime ${{ matrix.goos }} ${{ matrix.goarch }}
    needs: policy
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: [self-hosted, linux, X64, kcice-ci]
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
          - runner: [self-hosted, macOS, ARM64, kcice-ci]
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out the exact validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.policy.outputs.validated_head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out revision
        env:
          EXPECTED_HEAD_SHA: ${{ needs.policy.outputs.validated_head_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Set up Go from the reviewed runtime manifest
        uses: actions/setup-go@v6
        with:
          go-version-file: runtime/go.mod
          cache-dependency-path: runtime/go.sum
      - name: Build and execute the native single-file runtime
        env:
          RUNTIME_VERSION: v0.0.0-ci.${{ needs.policy.outputs.validated_head_sha }}
          SOURCE_REVISION: ${{ needs.policy.outputs.validated_head_sha }}
        run: |
          make runtime-release-bundle-one \
            RUNTIME_GOOS=${{ matrix.goos }} \
            RUNTIME_GOARCH=${{ matrix.goarch }} \
            VERSION="$RUNTIME_VERSION" \
            SOURCE_REVISION="$SOURCE_REVISION"
          python3 scripts/check_runtime_release.py \
            --dist dist \
            --version "$RUNTIME_VERSION" \
            --target ${{ matrix.goos }}/${{ matrix.goarch }} \
            --execute-native
      - name: Verify transactional deployment and release metadata
        run: |
          cd runtime
          go test -mod=readonly \
            -run '^(TestRealNativeBinaryStagesAttestsRunsAndUninstalls|TestRealFourTargetBuildsContainExactFrozenAttestations)$' \
            -v ./internal/deployment ./internal/releasebundle
      - name: Verify foreground fallback through an SSH tunnel
        env:
          JAT_RUNTIME_SERVICE_BINARY: ${{ github.workspace }}/dist/sshserver-${{ matrix.goos }}-${{ matrix.goarch }}
        run: go test -mod=readonly -run '^TestRuntimeForegroundSSHTunnel$' -v ./integration
      - name: Verify the macOS user service through an SSH tunnel
        if: runner.os == 'macOS'
        env:
          JAT_RUNTIME_SERVICE_BINARY: ${{ github.workspace }}/dist/sshserver-${{ matrix.goos }}-${{ matrix.goarch }}
        run: go test -mod=readonly -run '^TestRuntimeUserServiceSSHTunnel$' -v ./integration

  report:
    timeout-minutes: 120
    name: Publish repository-policy status
    if: ${{ !cancelled() && ((always() && inputs.pull_request_number > 0) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) }}
    needs: [policy, crypto_kat, runtime_matrix]
    runs-on: [self-hosted, linux, X64, kcice-ci]
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Publish result on pull-request head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
          POLICY_RESULT: ${{ needs.policy.result }}
          KAT_RESULT: ${{ needs.crypto_kat.result }}
          RUNTIME_RESULT: ${{ needs.runtime_matrix.result }}
          VALIDATED_HEAD_SHA: ${{ needs.policy.outputs.validated_head_sha }}
        run: |
          set -euo pipefail
          test -n "$VALIDATED_HEAD_SHA"
          current_head_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .head.sha)"
          test "$current_head_sha" = "$VALIDATED_HEAD_SHA"
          state=failure
          description="Manual policy, crypto KAT, or runtime matrix failed"
          if [ "$POLICY_RESULT" = success ] && [ "$KAT_RESULT" = success ] && [ "$RUNTIME_RESULT" = success ]; then
            state=success
            description="Manual policy, crypto KAT, and runtime matrix passed"
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${VALIDATED_HEAD_SHA}" \
            -f state="$state" \
            -f context="Repository policy" \
            -f description="$description" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
